<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الذاكرة - نظام المراحل 🧠</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div class="card">
        <!-- عنوان المرحلة والطابع -->
        <div class="level-header">
            <span id="theme-badge" class="theme-badge">عصور وسطى 🏰</span>
            <h1 id="level-title">المرحلة 1</h1>
        </div>

        <!-- التنقل بين المراحل المفتوحة فقط -->
        <div class="level-nav">
            <button id="btn-prev-lvl" class="nav-btn" onclick="changeLevel(-1)">◀ السابقة</button>
            <span id="unlocked-info" class="unlocked-info">المرحلة 1 / 20</span>
            <button id="btn-next-lvl" class="nav-btn" onclick="changeLevel(1)">التالية ▶</button>
        </div>

        <!-- لوحة أسرع بطل للمرحلة الحالية -->
        <div class="leaderboard-box">
            <div class="lb-title">🏆 أسرع إنجاز لهذه المرحلة:</div>
            <div id="lb-record" class="lb-record">لا يوجد رقم قياسي بعد - كن الأول!</div>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">المحاولات</span>
                <span id="moves-count" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">الوقت</span>
                <span id="timer" class="stat-value">00:00</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">الأزواج</span>
                <span id="matches-count" class="stat-value">0 / 4</span>
            </div>
        </div>

        <!-- شبكة الكروت -->
        <div class="grid-container" id="grid-container"></div>

        <!-- الأزرار -->
        <div class="controls">
            <button class="btn" onclick="restartLevel()">إعادة المرحلة 🔄</button>
        </div>

        <div class="developer-footer">unset The First Step of H~~H</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
